<ul class="writing-list">
  {{- range . }}
  <li>
    <a href="{{ .RelPermalink }}"{{ if .Date.IsZero }} class="undated"{{ end }}>
      {{- if not .Date.IsZero }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
      {{- end }}
      <span class="writing-title">{{ .Title }}{{ if .Draft }} <small>(Draft)</small>{{ end }}</span>
    </a>
  </li>
  {{- end }}
</ul>
